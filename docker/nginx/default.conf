# Served by the "blog" container (stock nginx:alpine). TLS termination
# happens at Cloudflare; cloudflared talks plain HTTP to this container
# inside the shared Docker network (see docker/compose.yaml, DOCKER_NETWORK).
#
# CF-Connecting-IP is only trusted when the request actually comes from
# inside that Docker network -- adjust set_real_ip_from below if your
# network uses a narrower/different subnet than the common Docker defaults.

# --- www.guthrieec.dev / guthrieec.dev -------------------------------------
# Static site, also the default server for any unmatched Host header.
server {
    listen 80 default_server;
    server_name www.guthrieec.dev guthrieec.dev;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;


    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # frame-src: pages on this site may embed the Shiny server via iframe.
    # No third-party script/style/img sources anywhere -- everything
    # (CSS, KaTeX, fonts) is self-hosted, so default-src 'self' is enough.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://shiny.guthrieec.dev; form-action 'self' https://lists.guthrieec.dev; base-uri 'self'; object-src 'none'; frame-ancestors 'self';" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets are not currently fingerprinted by the Hugo build (no
    # content hash in the filename), so we cache them for a day rather than
    # marking them immutable. If you switch to Hugo Pipes fingerprinting
    # (resources.Fingerprint) later, raise max-age and add "immutable" here.
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        try_files $uri =404;
    }
}

# --- lists.guthrieec.dev ----------------------------------------------------
# Reverse proxy to Listmonk, but only for the public, unauthenticated
# endpoints documented at https://listmonk.app/docs/configuration/ .
# Everything else -- including /admin and /api -- returns 404 rather than
# being proxied, so the admin UI is only reachable via the LAN-only
# LISTMONK_ADMIN_PORT (see docker/compose.yaml and .env.example).
server {
    listen 80;
    server_name lists.guthrieec.dev;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker's embedded DNS resolver. Resolving "listmonk" through a
    # variable (rather than a bare proxy_pass host) defers the lookup to
    # request time instead of nginx startup/reload time, so `nginx -t` and
    # container start don't depend on the listmonk service already being up
    # or even attached to the network yet (useful for CI and for bringing
    # up only part of the stack, e.g. `docker compose up -d blog shiny`).
    resolver 127.0.0.11 valid=30s;

    location ~ ^/(subscription|link|campaign|public|uploads)/ {
        set $listmonk_upstream listmonk:9000;
        proxy_pass http://$listmonk_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment if you enable Settings -> General -> "Public mailing list
    # archive" in the Listmonk admin UI.
    # location /archive {
    #     set $listmonk_upstream listmonk:9000;
    #     proxy_pass http://$listmonk_upstream;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        return 404;
    }
}
