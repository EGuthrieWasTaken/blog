version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/shiny"
    schedule:
      interval: "weekly"

  # compose.yaml's own image: tags (nginx, postgres, listmonk) -- the
  # "docker" ecosystem only reads Dockerfiles, not compose files.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
