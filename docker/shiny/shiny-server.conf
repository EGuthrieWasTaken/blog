# Minimal Shiny Server config. Apps live under /srv/shiny-server, which the
# compose stack bind-mounts read-only from ../../shiny-apps.
#
# NOTE: open-source Shiny Server has no built-in authentication -- see the
# "Security notes" section of the top-level README before exposing this
# publicly.

run_as shiny;

server {
  listen 3838;

  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index off;
    app_idle_timeout 300;
  }
}
